name: MCP Windows artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'vcpkg.json'
      - 'res/vcpkg/**'
      - '.gitmodules'
      - 'mcp/**'
      - '.github/workflows/mcp-windows.yml'

permissions:
  contents: read

concurrency:
  group: mcp-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/build/mcp-tools/uv-cache
      UV_PYTHON_DOWNLOADS: never
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - name: Install uv in the ephemeral CI runner
        run: python -m pip install uv==0.11.11
      - name: Cache isolated build tools (vcpkg/rustup/python helpers)
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            build/mcp-tools/vcpkg/installed
            build/mcp-tools/vcpkg-downloads
            build/mcp-tools/rustup
            build/mcp-tools/python
            build/mcp-tools/uv-cache
          key: mcp-tools-${{ hashFiles('mcp/scripts/bootstrap-build.ps1', 'res/vcpkg/**', 'mcp/server/uv.lock') }}
          restore-keys: mcp-tools-
      - name: Cache cargo registry
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: build/c/registry
          key: mcp-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: mcp-cargo-
      - name: Prepare isolated build tools
        run: |
          uv pip install --target build/mcp-tools/python libclang==18.1.1 cmake==4.4.4
          ./mcp/scripts/bootstrap-build.ps1
      - name: Python MCP regression checks
        run: ./mcp/scripts/dev.ps1 python -m unittest discover -s mcp/server/tests -v
      - name: Build bridge executable
        run: ./mcp/scripts/build.ps1
      - name: Check ordinary feature-off library
        run: ./mcp/scripts/build.ps1 -FeatureOff
      - name: Package delivery ZIP
        run: ./mcp/scripts/package.ps1
      - name: Upload executable (no release publishing)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rustdesk-mcp-windows-x64
          path: build/mcp-dist/
          if-no-files-found: error
