name: MCP Windows artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/mcp_bridge/**'
      - 'src/mcp_bridge_main.rs'
      - 'src/client.rs'
      - 'src/core_main.rs'
      - 'src/lib.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'mcp/**'
      - '.github/workflows/mcp-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/build/mcp-tools/uv-cache
      UV_PYTHON_DOWNLOADS: never
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - name: Install uv in the ephemeral CI runner
        run: python -m pip install uv==0.11.11
      - name: Prepare isolated build tools
        run: |
          uv pip install --target build/mcp-tools/python libclang==18.1.1 cmake==4.4.4
          ./mcp/scripts/bootstrap-build.ps1
      - name: Python MCP regression checks
        run: ./mcp/scripts/dev.ps1 python -m unittest discover -s mcp/server/tests -v
      - name: Build bridge executable
        run: ./mcp/scripts/build.ps1
      - name: Check ordinary feature-off library
        run: ./mcp/scripts/build.ps1 -FeatureOff
      - name: Upload executable (no release publishing)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rustdesk-mcp-windows-x64
          path: build/mcp-dist/
          if-no-files-found: error
