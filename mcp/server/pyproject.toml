[project]
name = "rustdesk-mcp-server"
version = "0.2.0"
description = "Local MCP adapter for the RustDesk terminal bridge"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0"]

[project.scripts]
rustdesk-mcp = "rustdesk_mcp.app:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rustdesk_mcp"]
